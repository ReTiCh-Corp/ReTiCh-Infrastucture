# Créer ce secret avant de lancer le test :
#
#   kubectl create secret generic retich-load-test-env \
#     --from-literal=EMAIL=your@email.com \
#     --from-literal=PASSWORD=YourPassword \
#     --from-literal=AUDIENCE=retich-client \
#     -n k6
#
# Ne jamais commiter ce fichier avec de vraies valeurs.

apiVersion: v1
kind: Secret
metadata:
  name: retich-load-test-env
  namespace: k6
type: Opaque
stringData:
  EMAIL: "change-me@example.com"
  PASSWORD: "Change-Me123"
  AUDIENCE: "retich-client"
