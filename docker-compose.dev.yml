# Development override - Hot-reload enabled for all services
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  # =============================================================================
  # MICROSERVICES WITH HOT-RELOAD
  # =============================================================================
  api-gateway:
    depends_on:
      auth:
        condition: service_healthy
    build:
      context: ../ReTiCh-API-Gateway
      dockerfile: Dockerfile.dev
    volumes:
      - ../ReTiCh-API-Gateway:/app
      - api-gateway-tmp:/app/tmp
      - go-mod-cache:/go/pkg/mod
      - api-gateway-build-cache:/root/.cache/go-build
    environment:
      - APP_ENV=development
      - PORT=8080
      - AUTH_SERVICE_URL=http://auth:8089
      - USER_SERVICE_URL=http://user:8083
      - MESSAGING_SERVICE_URL=http://messaging:8082
      - NATS_URL=nats://nats:4222
      - REDIS_URL=redis:6379
      - LOG_LEVEL=debug
      - JWKS_URL=http://auth:8089/.well-known/jwks.json
      - JWT_ISSUER=http://localhost:8089
      - GOMAXPROCS=2
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources: {}

  auth:
    build:
      context: ../ReTiCh-Auth
      dockerfile: Dockerfile.dev
    volumes:
      - ../ReTiCh-Auth:/app
      - auth-tmp:/app/tmp
      - go-mod-cache:/go/pkg/mod
      - auth-build-cache:/root/.cache/go-build
    environment:
      - PORT=8089
      - APP_URL=http://localhost:8089
      - DATABASE_URL=postgres://retich:retich_secret@postgres:5432/retich_auth?sslmode=disable
      - REDIS_URL=redis:6379
      - JWT_SECRET=dev-secret-key
      - LOG_LEVEL=debug
      - GOMAXPROCS=2
      - RESEND_API_KEY=re_your_api_key_here
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8089/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources: {}

  messaging:
    build:
      context: ../ReTiCh-Messaging
      dockerfile: Dockerfile.dev
    volumes:
      - ../ReTiCh-Messaging:/app
      - messaging-tmp:/app/tmp
      - go-mod-cache:/go/pkg/mod
      - messaging-build-cache:/root/.cache/go-build
    environment:
      - PORT=8082
      - NATS_URL=nats://nats:4222
      - REDIS_URL=redis:6379
      - DATABASE_URL=postgres://retich:retich_secret@postgres:5432/retich_messaging?sslmode=disable
      - USER_SERVICE_URL=http://user:8083
      - LOG_LEVEL=debug
      - AUTO_MIGRATE=true
      - GOMAXPROCS=2
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources: {}

  user:
    build:
      context: ../ReTiCh-User
      dockerfile: Dockerfile.dev
    volumes:
      - ../ReTiCh-User:/app
      - user-tmp:/app/tmp
      - go-mod-cache:/go/pkg/mod
      - user-build-cache:/root/.cache/go-build
      - user-uploads:/app/uploads
    environment:
      - PORT=8083
      - DATABASE_URL=postgres://retich:retich_secret@postgres:5432/retich_users?sslmode=disable
      - REDIS_URL=redis:6379
      - LOG_LEVEL=debug
      - AUTO_MIGRATE=true
      - GOMAXPROCS=2
      - UPLOADS_DIR=./uploads
      - BASE_URL=http://user:8083
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8083/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources: {}

  client:
    build:
      context: ../ReTiCh-Client
      dockerfile: Dockerfile.dev
    volumes:
      - ../ReTiCh-Client:/app
    environment:
      - VITE_API_BASE_URL=http://localhost:8080
      # - VITE_AUTH_BASE_URL=https://retich-auth.ashyplant-a8bd2417.francecentral.azurecontainerapps.io/
      - VITE_AUTH_BASE_URL=http://localhost:8089
      - VITE_AUTH_REDIRECT_URI=http://localhost:5173/callback
      - VITE_AUTH_CLIENT_SECRET=798ca07c-6cc9-4dfc-b522-5f215fc09c32
      - VITE_AUTH_CLIENT_ID=2149a378-89d3-44ca-be44-dfd7e1541ecf
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"

  # =============================================================================
  # INFRASTRUCTURE (no changes, just remove resource limits for dev)
  # =============================================================================
  postgres:
    deploy:
      resources: {}

  redis:
    deploy:
      resources: {}

  nats:
    deploy:
      resources: {}

  prometheus:
    deploy:
      resources: {}

  grafana:
    deploy:
      resources: {}

volumes:
  api-gateway-tmp:
  auth-tmp:
  messaging-tmp:
  user-tmp:
  user-uploads:
  go-mod-cache:
  api-gateway-build-cache:
  auth-build-cache:
  messaging-build-cache:
  user-build-cache:
